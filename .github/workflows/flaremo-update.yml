# Weekly deterministic upstream file take for self-hosted forks.
# This is not a 1:1 replay of upstream history onto main, and it never
# merges its own pull request. Pushing a merge to main still publishes
# the Worker via Deploy to Cloudflare.
name: Weekly upstream file take

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to compare, for example v0.22.0. Leave empty for latest."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flaremo-weekly-upstream-take
  cancel-in-progress: false

jobs:
  take-upstream-files:
    if: github.repository != 'realchendahuang/FlareMo'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
      UPSTREAM_REPOSITORY: realchendahuang/FlareMo
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Compare upstream and open a file-take pull request
        shell: bash
        run: |
          set -euo pipefail

          target_version="${REQUESTED_VERSION}"
          if [[ -z "${target_version}" ]]; then
            target_version="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [[ ! "${target_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid FlareMo release tag: ${target_version}" >&2
            exit 1
          fi

          current_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"

          git remote add flaremo-upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags flaremo-upstream \
            "refs/tags/${target_version}:refs/tags/${target_version}"

          if ! merge_base="$(git merge-base "origin/${BASE_BRANCH}" "refs/tags/${target_version}")"; then
            echo "No merge-base with ${target_version}; refusing a guessy file take." >&2
            exit 1
          fi

          report="$(mktemp)"
          body="$(mktemp)"
          node ./scripts/run-weekly-upstream-take.mjs \
            --ours "origin/${BASE_BRANCH}" \
            --base "${merge_base}" \
            --theirs "refs/tags/${target_version}" \
            --target-version "${target_version}" \
            --current-version "${current_version}" \
            --report "${report}" \
            --body "${body}"

          open_pr="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).openPullRequest" "${report}")"
          if [[ "${open_pr}" != "true" ]]; then
            echo "No eligible upstream files to take. Exiting green."
            cat "${report}"
            exit 0
          fi

          update_branch="flaremo-weekly/${target_version}"
          git config user.name "flaremo-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${update_branch}" "origin/${BASE_BRANCH}"
          node ./scripts/run-weekly-upstream-take.mjs \
            --ours HEAD \
            --base "${merge_base}" \
            --theirs "refs/tags/${target_version}" \
            --target-version "${target_version}" \
            --current-version "${current_version}" \
            --apply
          git add -A
          git commit -m "Take eligible files from FlareMo ${target_version}"

          git push --force-with-lease --set-upstream origin "${update_branch}"

          existing_pr="$(gh pr list --head "${update_branch}" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "${existing_pr}" ]]; then
            echo "Update pull request already exists: ${existing_pr}"
            gh pr edit "${existing_pr}" --body-file "${body}"
            exit 0
          fi

          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${update_branch}" \
            --title "Take eligible FlareMo ${target_version} files" \
            --body-file "${body}"
          echo "Opened a pull request. This job does not merge it."
