name: Prepare FlareMo update

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to install, for example v0.3.1. Leave empty for latest."
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flaremo-update
  cancel-in-progress: false

jobs:
  prepare-update:
    if: github.repository != 'realchendahuang/FlareMo'
    runs-on: ubuntu-latest
    env:
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
      GH_TOKEN: ${{ github.token }}
      REQUESTED_VERSION: ${{ inputs.version }}
      UPSTREAM_REPOSITORY: realchendahuang/FlareMo
    steps:
      - name: Check out deployment repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Prepare update pull request
        shell: bash
        run: |
          set -euo pipefail

          target_version="${REQUESTED_VERSION}"
          if [[ -z "${target_version}" ]]; then
            target_version="$(gh api "repos/${UPSTREAM_REPOSITORY}/releases/latest" --jq .tag_name)"
          fi
          if [[ ! "${target_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid FlareMo release tag: ${target_version}" >&2
            exit 1
          fi

          current_version="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [[ ! "${current_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid installed FlareMo version: ${current_version}" >&2
            exit 1
          fi

          target_number="${target_version#v}"
          IFS=. read -r current_major current_minor current_patch <<< "${current_version}"
          IFS=. read -r target_major target_minor target_patch <<< "${target_number}"
          if (( target_major < current_major ||
                (target_major == current_major && target_minor < current_minor) ||
                (target_major == current_major && target_minor == current_minor && target_patch < current_patch) )); then
            echo "Refusing to downgrade FlareMo from v${current_version} to ${target_version}." >&2
            exit 1
          fi
          if [[ "${target_number}" == "${current_version}" ]]; then
            echo "${target_version} is already installed."
            exit 0
          fi

          update_branch="flaremo-update/${target_version}"
          if git ls-remote --exit-code --heads origin "${update_branch}" >/dev/null 2>&1; then
            existing_pr="$(gh pr list --head "${update_branch}" --state open --json url --jq '.[0].url // empty')"
            echo "Update branch ${update_branch} already exists; not re-applying."
            if [[ -n "${existing_pr}" ]]; then
              echo "Update pull request already exists: ${existing_pr}"
            fi
            exit 0
          fi

          git remote add flaremo-upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags flaremo-upstream \
            "refs/tags/v${current_version}:refs/tags/v${current_version}" \
            "refs/tags/${target_version}:refs/tags/${target_version}"

          git config user.name "flaremo-update[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "${update_branch}" "origin/${BASE_BRANCH}"

          update_patch="$(mktemp)"
          git diff --binary --full-index \
            "refs/tags/v${current_version}" \
            "refs/tags/${target_version}" > "${update_patch}"

          apply_status=0
          git apply --3way --index "${update_patch}" || apply_status=$?
          unmerged="$(git diff --name-only --diff-filter=U || true)"
          outcome="$(node --input-type=module -e '
            import { updateApplyOutcome } from "./scripts/prepare-flaremo-update.mjs";
            const applyExitCode = Number(process.argv[1]);
            const unmergedFiles = process.argv[2] ? process.argv[2].split("\n") : [];
            const outcome = updateApplyOutcome({ applyExitCode, unmergedFiles });
            process.stdout.write(JSON.stringify(outcome));
          ' "${apply_status}" "${unmerged}")"
          kind="$(node -p "JSON.parse(process.argv[1]).kind" "${outcome}")"
          fail_job="$(node -p "JSON.parse(process.argv[1]).failJob" "${outcome}")"
          files_json="$(node -p "JSON.stringify(JSON.parse(process.argv[1]).files)" "${outcome}")"

          if [[ "${fail_job}" == "true" ]]; then
            echo "The deployment repository conflicts with ${target_version} and Git could not open a three-way apply." >&2
            exit 1
          fi

          if [[ "${kind}" == "conflicts" ]]; then
            node --input-type=module -e '
              import { writeFileSync } from "node:fs";
              import { conflictReportMarkdown } from "./scripts/prepare-flaremo-update.mjs";
              const files = JSON.parse(process.argv[3]);
              writeFileSync(
                "FLAREMO_UPDATE_CONFLICTS.md",
                conflictReportMarkdown({
                  currentVersion: process.argv[1],
                  targetVersion: process.argv[2],
                  files,
                  upstreamRepository: process.env.UPSTREAM_REPOSITORY,
                }),
              );
            ' "${current_version}" "${target_version}" "${files_json}"
            if [[ -n "${unmerged}" ]]; then
              # Stage markers so both sides stay in the PR. Do not checkout --theirs.
              git add -- ${unmerged}
            fi
            git add -- FLAREMO_UPDATE_CONFLICTS.md
          fi

          git commit -m "Update FlareMo from v${current_version} to ${target_version}"
          git push --set-upstream origin "${update_branch}"

          existing_pr="$(gh pr list --head "${update_branch}" --state open --json url --jq '.[0].url // empty')"
          if [[ -n "${existing_pr}" ]]; then
            echo "Update pull request already exists: ${existing_pr}"
            exit 0
          fi

          pr_dir="$(mktemp -d)"
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            import { updatePullRequest } from "./scripts/prepare-flaremo-update.mjs";
            const files = JSON.parse(process.argv[3]);
            const pr = updatePullRequest({
              currentVersion: process.argv[1],
              targetVersion: process.argv[2],
              files,
              upstreamRepository: process.env.UPSTREAM_REPOSITORY,
            });
            writeFileSync(process.argv[4], pr.title);
            writeFileSync(process.argv[5], pr.body);
          ' "${current_version}" "${target_version}" "${files_json}" \
            "${pr_dir}/title" "${pr_dir}/body"
          gh pr create \
            --base "${BASE_BRANCH}" \
            --head "${update_branch}" \
            --title "$(cat "${pr_dir}/title")" \
            --body-file "${pr_dir}/body"
