# Self-hosted fork production deploy. Runs on push to main and on
# workflow_dispatch. Upstream realchendahuang/FlareMo never runs this job.
#
# The job still generates wrangler.jsonc, provisions resources, builds the
# frontend, and syncs auth Worker secrets. cloudflare/wrangler-action runs
# D1 migrations and wrangler deploy. Mail credentials (RESEND_API_KEY) stay
# as Cloudflare Worker secrets — do not put them in GitHub Actions secrets.
name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build, wrangler dry-run, and read-only resource check; skip D1 migration, publish, and secret sync"
        required: false
        type: boolean
        default: false
      provision:
        description: "Create missing D1, R2, Queue, and Vectorize resources"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: flaremo-cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository != 'realchendahuang/FlareMo'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare credentials
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "Missing repository secret CLOUDFLARE_API_TOKEN." >&2
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "Missing repository secret CLOUDFLARE_ACCOUNT_ID." >&2
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write wrangler.jsonc
        env:
          WRANGLER_JSONC: ${{ secrets.WRANGLER_JSONC }}
          FLAREMO_D1_DATABASE_ID: ${{ secrets.FLAREMO_D1_DATABASE_ID }}
          FLAREMO_PUBLIC_URL: ${{ vars.FLAREMO_PUBLIC_URL || secrets.FLAREMO_PUBLIC_URL }}
          FLAREMO_DEPLOY_REPOSITORY: ${{ vars.FLAREMO_DEPLOY_REPOSITORY }}
          FLAREMO_EMAIL_PROVIDER: ${{ vars.FLAREMO_EMAIL_PROVIDER }}
          FLAREMO_EMAIL_FROM: ${{ vars.FLAREMO_EMAIL_FROM }}
        run: node ./scripts/write-wrangler-config.mjs

      - name: Provision / verify Cloudflare resources
        run: |
          set -euo pipefail
          DRY_RUN="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}"
          PROVISION="${{ github.event_name != 'workflow_dispatch' && true || inputs.provision }}"
          if [[ "${PROVISION}" == "true" && "${DRY_RUN}" != "true" ]]; then
            pnpm provision:remote
          else
            pnpm provision:remote -- --check
          fi

      - name: Deploy preflight
        run: pnpm deploy:preflight

      - name: Build web app
        run: pnpm --filter @flaremo/web build

      - name: Apply D1 migrations
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: d1 migrations apply DB --remote --config ./wrangler.jsonc

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.129.1"
          command: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'deploy --config ./wrangler.jsonc --dry-run' || 'deploy --config ./wrangler.jsonc' }}

      - name: Sync Worker secrets
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          FLAREMO_BOOTSTRAP_SECRET: ${{ secrets.FLAREMO_BOOTSTRAP_SECRET }}
        run: pnpm secrets:sync

      - name: Smoke check deployed site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        run: pnpm smoke:check
