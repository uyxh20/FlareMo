# 瘦 CI：只做格式 / lint / typecheck / 单元测试的防线（当前约 14 分钟）。
# 超时留 30 分钟而非贴着实测值：job 超时会把还在跑的步骤直接杀掉，
# 拿不到任何「哪一步慢」的信号，而 CI 机器波动让耗时会自然漂移。
# 定位（2026-09-10 起引入，见 AGENTS.md 与 docs/release.md）：
#   - 兜底「忘了本地跑 pnpm check」的情况，是 advisory + 外部 PR 强制门禁；
#   - 不跑 E2E、不构建、不部署：完整门禁（pnpm verify，含 Playwright E2E）
#     只在维护者明确要求时本地执行；日常 release 默认不自动跑；
#   - 上游与 push 流程不做生产部署；自托管 fork 的受控 workflow_dispatch 例外见 deploy-cloudflare.yml。
name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (format / lint / typecheck / unit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint & typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test
